[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "weathertag"
version = "0.1.0"
description = "Low-power household weather display for EPD-nRF5 electronic shelf labels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bleak>=1.1,<2",
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "Pillow>=11,<13",
]

[project.scripts]
weathertag = "weathertag.cli:main"

[tool.setuptools.packages.find]
include = ["weathertag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
